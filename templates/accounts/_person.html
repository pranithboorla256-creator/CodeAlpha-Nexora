<article class="person-row"><a class="person-main" href="{% url 'profile' person.username %}"><span class="avatar">{% if person.profile.avatar %}<img src="{{ person.profile.avatar.url }}" alt="">{% else %}{{ person.username|first|upper }}{% endif %}</span><span><strong>@{{ person.username }}</strong><span class="person-bio">{{ person.profile.bio|default:'Nexora community member' }}</span></span></a>{% if user.is_authenticated and user != person %}<button class="button small secondary follow-button" data-follow-url="{% url 'toggle_follow' person.username %}" data-following="{% if person.id in following_ids %}true{% else %}false{% endif %}">Follow</button>{% endif %}</article>
