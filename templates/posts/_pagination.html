{% if page_obj.has_other_pages %}<nav class="pagination" aria-label="Pagination">{% if page_obj.has_previous %}<a class="button secondary" href="?page={{ page_obj.previous_page_number }}{% if feed_filter %}&amp;filter={{ feed_filter }}{% endif %}">← Newer</a>{% else %}<span></span>{% endif %}<span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a class="button secondary" href="?page={{ page_obj.next_page_number }}{% if feed_filter %}&amp;filter={{ feed_filter }}{% endif %}">Older →</a>{% endif %}</nav>{% endif %}
